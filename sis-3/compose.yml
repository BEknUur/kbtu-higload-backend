name: sis3

services:
  primary:
    image: postgres:17
    env_file: .env
    shm_size: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      retries: 30

  bench:
    profiles: [bench]
    build:
      dockerfile_inline: |
        FROM python:3.12-slim
        RUN pip install --no-cache-dir asyncpg==0.30.0 uvloop==0.21.0
    volumes:
      - ./benchmark/bench.py:/bench.py:ro
    command: [python, /bench.py]