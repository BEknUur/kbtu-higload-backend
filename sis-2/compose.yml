name: sis2

services:
  postgres:
    image: postgres:17
    environment:
       POSTGRES_DB: catalog
       POSTGRES_USER: catalog
       POSTGRES_PASSWORD: catalog_dev 
    
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog -d catalog"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
  
  redis:
    image: redis:7.4
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
    - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    

volumes:
  postgres_data:

