syntax = "proto3";

package catalog.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

service ProductService {
  rpc GetProduct(GetProductRequest) returns (Product);
  rpc ListProducts(ListProductsRequest) returns (ListProductsResponse);
  rpc ListCategories(google.protobuf.Empty) returns (ListCategoriesResponse);
  rpc CreateProduct(CreateProductRequest) returns (Product);
  rpc UpdateProduct(UpdateProductRequest) returns (Product);
  rpc DeleteProduct(DeleteProductRequest) returns (google.protobuf.Empty);
}

message Product {
  int64 id = 1;
  string sku = 2;
  string name = 3;
  string description = 4;
  string price = 5;
  int64 category_id = 6;
  map<string, string> attributes = 7;
  repeated string image_keys = 8;
  int32 version = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
}

message Category {
  int64 id = 1;
  optional int64 parent_id = 2;
  string name = 3;
}

message GetProductRequest {
  int64 id = 1;
}

message ListProductsRequest {
  int64 cursor = 1;
  int32 limit = 2;
  optional int64 category_id = 3;
  optional string price_min = 4;
  optional string price_max = 5;
  optional string color = 6;
}

message ListProductsResponse {
  repeated Product items = 1;
  optional int64 next_cursor = 2;
}

message ListCategoriesResponse {
  repeated Category categories = 1;
}

message CreateProductRequest {
  string sku = 1;
  string name = 2;
  string description = 3;
  string price = 4;
  int64 category_id = 5;
  map<string, string> attributes = 6;
  repeated string image_keys = 7;
}

message UpdateProductRequest {
  int64 id = 1;
  int32 expected_version = 2;
  google.protobuf.FieldMask update_mask = 3;
  string name = 4;
  string description = 5;
  string price = 6;
  int64 category_id = 7;
  map<string, string> attributes = 8;
  repeated string image_keys = 9;
}

message DeleteProductRequest {
  int64 id = 1;
}
